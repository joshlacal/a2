name: ci

on:
  pull_request:
    paths-ignore:
      - '.github/**'
      - 'README.md'

  push:
    branches: ['master']
    paths-ignore:
      - '.github/**'
      - 'README.md'

concurrency:
  # Support push/pr as event types with different behaviors each:
  # 1. push: queue up builds
  # 2. pr: only allow one run per PR
  group: ${{ github.workflow }}-${{ github.event.type }}${{ github.event.pull_request.number }}
  # If there is already a workflow running for the same pull request, cancel it
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tasks:
    name: "[${{ matrix.os }}] ${{ matrix.cargo.name }}"
    runs-on: "${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        rust:
          - "1.99.1"
        cargo:
          - name: "Clippy"
            cmd: clippy
            args: -- -D clippy::all
            cache: {}
          - name: "Clippy (ring feature)"
            cmd: clippy
            args: --no-default-features --features ring -- -D clippy::all
            cache: {}
          - name: "Formatting"
            cmd: fmt
            args: -- --check
            cache: {}
          - name: "Unit Tests"
            cmd: test
            args: --all-features
            cache: { sharedKey: "tests" }
          - name: "Unit Tests (ring feature)"
            cmd: test
            args: --no-default-features --features ring
            cache: { sharedKey: "tests-ring" }
        include:
          - os: ubuntu-latest
            sccache-path: /home/runner/.cache/sccache
    env:
      RUST_BACKTRACE: full
      RUSTC_WRAPPER: sccache
      SCCACHE_CACHE_SIZE: 1G
      SCCACHE_DIR: ${{ matrix.sccache-path }}
    steps:
      # Checkout code
      - name: "Git checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Install the current pinned compiler cache.
      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0

      # Install Rust toolchain
      - name: "Install Rust ${{ matrix.rust }}"
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      # Rebuild cache
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ matrix.cargo.name }}
        continue-on-error: false

      - name: Cache sccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: false
        with:
          path: ${{ matrix.sccache-path }}
          key: ${{ runner.os }}-sccache-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sccache-

      - name: "Task ${{ matrix.cargo.name }}"
        run: cargo ${{ matrix.cargo.cmd }} ${{ matrix.cargo.args }}
